name: Shell script linter

on:
  push:
    branches:
      - main
      - dev
      - "codex/**"
    paths:
      - '**.sh'
  workflow_dispatch:
  pull_request:

permissions: {}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install syntax checkers
        run: sudo apt-get update && sudo apt-get install -y shellcheck zsh
      - name: Check Bash scripts and hooks
        run: make lint-shell
      - name: Check Zsh configuration
        run: |
          zsh -n zshrc
          zsh -n zprofile
