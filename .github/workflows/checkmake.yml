name: Makefile linter

on:
  push:
    branches:
      - main
      - dev
      - "codex/**"
    paths:
      - "Makefile"
  workflow_dispatch:
  pull_request:

permissions: {}

jobs:
  checkmake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Run Checkmake
        id: checkmake
        uses: Uno-Takashi/checkmake-action@main
